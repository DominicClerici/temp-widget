<?xml version="1.0" encoding="UTF-8"?>
<!-- Solid silhouette rather than an outline, and an explicit white rather than
     currentColor: librsvg resolves an unset currentColor to black, which is
     what made the outline version render as a dark thermometer wherever the
     shell handed the file to the SVG loader without recolouring it. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <g fill="#ffffff">
    <rect x="6.5" y="1" width="3" height="10" rx="1.5"/>
    <circle cx="8" cy="11.5" r="3.25"/>
  </g>
</svg>
